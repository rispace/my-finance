<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Finance</title>
    <meta name="description" content="Track spending, earnings, budgets, credit cards, loans and assets. Your data stays on your device and in your own Google Drive.">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Finance">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></symbol>
        <symbol id="i-income" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></symbol>
        <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7V5.5A1.5 1.5 0 0 0 15.3 4L5.6 5.4A2 2 0 0 0 4 7.4V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H5"/><path d="M20 12h-3a1.5 1.5 0 0 0 0 3h3"/></symbol>
    </defs>
</svg>

<div class="app">
    <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/">
            <span class="brand-mark"><svg width="18" height="18"><use href="#i-logo"/></svg></span>
            Finance
        </a>
        <a class="btn" href="#/add"><svg><use href="#i-plus"/></svg>Add transaction</a>
        <a class="nav-link" data-nav="overview" href="#/"><svg><use href="#i-home"/></svg>Overview</a>
        <a class="nav-link" data-nav="activity" href="#/activity"><svg><use href="#i-list"/></svg>Transactions</a>
        <a class="nav-link" data-nav="earnings" href="#/earnings"><svg><use href="#i-income"/></svg>Earnings</a>
        <a class="nav-link" data-nav="debt" href="#/cards"><svg><use href="#i-card"/></svg>Debt</a>
        <a class="nav-link" data-nav="assets" href="#/assets"><svg><use href="#i-chart"/></svg>Assets</a>
        <div class="spacer"></div>
        <button type="button" class="sync-chip" data-sync-chip>Loading…</button>
        <a class="nav-link" data-nav="settings" href="#/settings"><svg><use href="#i-gear"/></svg>Settings</a>
        <div class="site-links faint" style="padding:8px 12px 0;font-size:12px"><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
    </aside>

    <header class="topbar">
        <a class="brand" href="#/">
            <span class="brand-mark"><svg width="18" height="18"><use href="#i-logo"/></svg></span>
            Finance
        </a>
        <div class="topbar-end">
            <button type="button" class="sync-chip" data-sync-chip>Loading…</button>
            <a class="icon-button" href="#/settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></a>
        </div>
    </header>

    <main class="main">
        <div class="container" id="view"><div class="boot">Loading…</div></div>
    </main>

    <nav class="tabbar" aria-label="Main navigation">
        <a class="tab" data-nav="overview" href="#/"><svg><use href="#i-home"/></svg>Home</a>
        <a class="tab" data-nav="activity" href="#/activity"><svg><use href="#i-list"/></svg>Activity</a>
        <a class="tab" data-nav="earnings" href="#/earnings"><svg><use href="#i-income"/></svg>Earnings</a>
        <a class="tab" data-nav="debt" href="#/cards"><svg><use href="#i-card"/></svg>Debt</a>
        <a class="tab" data-nav="assets" href="#/assets"><svg><use href="#i-chart"/></svg>Assets</a>
    </nav>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" class="sheet-close" data-close-sheet aria-label="Close">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
