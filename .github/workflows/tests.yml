name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests (no dependencies needed)
        run: |
          node tests/merge.test.mjs
          node tests/calc.test.mjs
          node tests/earnings.test.mjs
